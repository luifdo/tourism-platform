name: Frontend · GitHub Pages

# Publica la PWA (frontend/) en https://<usuario>.github.io/<repo>/ al integrar en develop.
# Requiere: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Pruebas (dominio, casos de uso, adaptadores y regla de dependencias)
        run: npm test

      - name: Compilar con la ruta del repositorio
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Sin Gateway publicado: las reservas usan el servicio simulado del navegador
          VITE_API_MOCK: "true"

      # GitHub Pages no reescribe rutas: 404.html permite abrir /servicios/... o /mis-reservas directamente
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
