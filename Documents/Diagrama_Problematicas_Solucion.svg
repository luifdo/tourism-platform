<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; }
      .header-prob { font-family: 'Segoe UI', sans-serif; font-size: 15px; font-weight: bold; fill: #991b1b; }
      .header-sol { font-family: 'Segoe UI', sans-serif; font-size: 15px; font-weight: bold; fill: #065f46; }
      .card-text { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; }
      .prob-text { fill: #9f1239; }
      .sol-text { fill: #065f46; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-dasharray: 4,4; }
      .arrow-head { fill: #64748b; }
    </style>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc" rx="12"/>

  <!-- Left Container: Problemáticas -->
  <rect x="30" y="30" width="410" height="420" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="30" width="410" height="42" rx="10" fill="#ffe4e6"/>
  <text x="50" y="57" class="header-prob">Problemáticas del Ecosistema Turístico</text>

  <!-- Problem Cards -->
  <g transform="translate(50, 90)">
    <!-- P1 -->
    <rect x="0" y="0" width="370" height="52" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="31" class="card-text prob-text">Concentración excesiva en sitios icónicos</text>

    <!-- P2 -->
    <rect x="0" y="68" width="370" height="52" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="99" class="card-text prob-text">Información dispersa y desactualizada</text>

    <!-- P3 -->
    <rect x="0" y="136" width="370" height="52" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="167" class="card-text prob-text">Exclusión digital de MiPyMEs turísticas</text>

    <!-- P4 -->
    <rect x="0" y="204" width="370" height="52" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="235" class="card-text prob-text">Falta de control de capacidad de carga</text>

    <!-- P5 -->
    <rect x="0" y="272" width="370" height="52" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="303" class="card-text prob-text">Inestabilidad en picos de demanda</text>
  </g>

  <!-- Connectors -->
  <path d="M 420 116 L 515 116" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 420 184 L 515 184" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 420 252 L 515 252" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 420 320 L 515 320" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 420 388 L 515 388" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Right Container: Soluciones -->
  <rect x="520" y="30" width="410" height="420" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="520" y="30" width="410" height="42" rx="10" fill="#d1fae5"/>
  <text x="540" y="57" class="header-sol">Solución: Plataforma Digital Integrada (FOSS)</text>

  <!-- Solution Cards -->
  <g transform="translate(540, 90)">
    <!-- S1 -->
    <rect x="0" y="0" width="370" height="52" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="31" class="card-text sol-text">Recomendación inteligente &amp; dispersión de flujos</text>

    <!-- S2 -->
    <rect x="0" y="68" width="370" height="52" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="99" class="card-text sol-text">Catálogo unificado, transparente y georreferenciado</text>

    <!-- S3 -->
    <rect x="0" y="136" width="370" height="52" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="167" class="card-text sol-text">Inclusión comunitaria y panel sin barreras técnicas</text>

    <!-- S4 -->
    <rect x="0" y="204" width="370" height="52" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="235" class="card-text sol-text">Monitoreo de aforo &amp; analítica institucional</text>

    <!-- S5 -->
    <rect x="0" y="272" width="370" height="52" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="303" class="card-text sol-text">Arquitectura de microservicios elástica y desacoplada</text>
  </g>
</svg>
