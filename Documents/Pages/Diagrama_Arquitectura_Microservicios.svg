<path d="M 920 866 L 960 866" class="wext" marker-end="url(#ax)"/>
<text x="968" y="870" class="lbl" text-anchor="start">Llamada externa</text>
<text x="40" y="906" class="lbl" text-anchor="start">Fuera del clúster: servicios externos (columna derecha). Gemini es la única dependencia propietaria (excepción justificada a la prioridad FOSS, SRS §2.4.1).</text>
