<rect width="1290" height="960" fill="#ffffff"/>
<text x="645" y="30" class="title" text-anchor="middle">Arquitectura de Microservicios — Plataforma Digital de Turismo Santa Marta</text>
<text x="645" y="50" class="sub" text-anchor="middle">5 microservicios Python + FastAPI en contenedores, desplegados en Kubernetes (k3s)</text>
<rect x="380" y="66" width="420" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#sh)"/>
