<text x="545" y="484" class="nt" text-anchor="middle" fill="#78350f">RabbitMQ — exchange turismo.eventos (topic) · cola por consumidor · reintentos y DLQ</text>
<text x="545" y="504" class="lev" text-anchor="middle">Publican: M1 prestador.aprobado · M3 reserva.solicitada / confirmada / rechazada / cancelada / finalizada · M4 resena.publicada</text>
<text x="545" y="521" class="lev" text-anchor="middle">M2, M3 y M4 publican además auditoria.registrada</text>
<text x="545" y="539" class="lev" text-anchor="middle">Consumen: M1 auditoria.registrada (bitácora) · M2 reservas, reseñas y prestadores (correos y métricas) · M4 reserva.finalizada (habilita reseña)</text>
