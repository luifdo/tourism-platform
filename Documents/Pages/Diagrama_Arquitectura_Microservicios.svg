<text x="185" y="732" class="nt" text-anchor="middle" fill="#881337">Valkey (caché en memoria)</text>
<text x="185" y="752" class="nd" text-anchor="middle" fill="#be123c">Caché de catálogo · sesiones del chatbot</text>
<text x="185" y="770" class="nd" text-anchor="middle" fill="#be123c">idempotencia de eventos — usado por M1, M2, M3 y M5</text>
<rect x="350" y="708" width="300" height="78" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.8" filter="url(#sh)"/>
<text x="500" y="732" class="nt" text-anchor="middle" fill="#0f172a">SeaweedFS (almacenamiento S3)</text>
<text x="500" y="752" class="nd" text-anchor="middle" fill="#475569">Documentos RNT / RUT (M1)</text>
<text x="500" y="770" class="nd" text-anchor="middle" fill="#475569">Respaldos de PostgreSQL (CloudNativePG)</text>
<rect x="665" y="708" width="390" height="78" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" filter="url(#sh)"/>
<text x="860" y="732" class="nt" text-anchor="middle" fill="#0c4a6e">Observabilidad — Prometheus · Grafana · Loki</text>
<text x="860" y="752" class="nd" text-anchor="middle" fill="#0369a1">Métricas /metrics y sondas /health de cada servicio</text>
<text x="860" y="770" class="nd" text-anchor="middle" fill="#0369a1">Logs con X-Correlation-ID · tableros de latencia p95</text>
<text x="545" y="818" class="lbl" text-anchor="middle">Persistencia políglota consolidada: un clúster PostgreSQL con una base lógica por servicio (Database-per-Service) + Valkey + almacenamiento S3.</text>
<text x="545" y="834" class="lbl" text-anchor="middle">Ningún servicio accede a la base de datos de otro; los datos ajenos se obtienen por REST o por eventos.</text>
