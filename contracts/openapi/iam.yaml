      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificacionAdminResponse'
        '503':
          description: 'Valkey no responde: no se puede comprobar la revocación del token (SERVICIO_NO_DISPONIBLE).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token ausente, inválido, expirado o revocado (TOKEN_INVALIDO).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El rol del usuario no es Admin (ROL_INSUFICIENTE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La cuenta no existe (USUARIO_NO_ENCONTRADO) o no hay un documento vigente de ese
            tipo (DOCUMENTO_NO_ENCONTRADO).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: No es Prestador (NO_ES_PRESTADOR), le falta el RNT o el RUT (DOCUMENTOS_INCOMPLETOS),
