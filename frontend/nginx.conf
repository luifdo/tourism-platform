# Servidor de la PWA (SPA con Vue Router). Traefik le manda todo lo que no es de un servicio (gateway/README.md).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Estos encabezados van a nivel de server a propósito: `expires` no los pisa, a diferencia de `add_header`
    # dentro de una location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy: solo código propio (sin scripts en línea ni eval). Lo externo que la PWA usa de verdad:
    #   - fuentes: Google Fonts (hoja en fonts.googleapis.com, archivos en fonts.gstatic.com);
    #   - mapa: teselas de OpenStreetMap, y las fotos de los servicios (S3 del propio proyecto, por https);
    #   - connect-src repite las teselas y las fuentes porque el Service Worker las pide con fetch y toma esta política.
    # style-src admite 'unsafe-inline' porque Vue y Leaflet ponen estilos en línea (style="..."); los scripts, no.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self'; connect-src 'self' https://tile.openstreetmap.org https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # El gateway nunca los enruta a un servicio; si llegan aquí es porque nadie los publica: 404, no el HTML de la PWA.
    location ~ ^/(internal|metrics|health)(/|$) {
        default_type application/json;
        return 404 '{"error":"NO_ENCONTRADO","message":"Ruta inexistente"}';
    }

    # Una ruta /api/... que ningún servicio tiene cae aquí: 404 en JSON, no el HTML con 200 (que un cliente tomaría por válido).
    # (^~ para que gane a la regla de extensiones de abajo: /api/.../algo.json también es 404 de la API.)
    location ^~ /api/ {
        default_type application/json;
        return 404 '{"error":"NO_ENCONTRADO","message":"Ruta de la API inexistente"}';
    }

    # Lo que el navegador debe revisar siempre: de aquí cuelga la versión nueva (Service Worker y archivos con hash).
    location = /index.html { expires -1; }
    location = /sw.js { expires -1; }
    location ~ ^/(workbox-[^/]+\.js|registerSW\.js)$ { expires -1; }
    # Algunas tablas de tipos MIME no traen .webmanifest: sin el tipo, el navegador no instala la PWA.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    # Archivos con hash en el nombre: nunca cambian, se guardan un año. Si falta uno, 404 (no el index.html).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Íconos, logos, video y demás archivos fijos. Nginx atiende los Range del video sin configuración.
    location ~* \.(?:png|jpe?g|webp|svg|ico|mp4|webm|woff2?|txt|json)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Cualquier otra ruta es de Vue Router (/servicios/..., /mis-reservas, /ingresar...): se entrega la app.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
