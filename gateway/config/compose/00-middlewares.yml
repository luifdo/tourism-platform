# Middlewares comunes del gateway (Traefik, proveedor de archivos). Traefik recarga esta carpeta solo.
# Las mismas piezas, como recursos de Kubernetes, están en ../k3s/.
#
# Las rutas NO declaran entryPoints: escuchan en todos los que existan. En local solo hay `web` (HTTP, :80); con
# infra/docker-compose.https.yml se agrega `websecure` (HTTPS, :443) y `web` pasa a redirigir a él, así que las mismas
# rutas sirven en los dos modos. El certificado y la redirección son de la configuración ESTÁTICA de Traefik.
http:
  middlewares:
    # En TODAS las rutas, también en las públicas: los servicios confían en X-Usuario-Id y X-Usuario-Rol,
    # así que un valor que mande el cliente no puede llegar nunca (C-13 del IAM).
    quitar-identidad:
      headers:
        customRequestHeaders:
          X-Usuario-Id: ""
          X-Usuario-Rol: ""

    # Valida el token con iam-service. Sin trustForwardHeader: Traefik fija él mismo X-Forwarded-Method
    # y X-Forwarded-Uri, que el IAM guarda en la bitácora. Si responde 200, Traefik copia estos dos
    # encabezados a la petición; con cualquier otro estado devuelve esa respuesta al cliente (401, 403, 503).
    iam-forward-auth:
      forwardAuth:
        address: http://iam-service:8001/api/iam/auth/verificar
        authResponseHeaders:
          - X-Usuario-Id
          - X-Usuario-Rol

    # Ruta protegida = primero se borra lo que traiga el cliente, después se valida el token y al final se limita el
    # cuerpo: así un anónimo no hace que se almacene nada (mismo orden que en las cargas de documentos).
    protegida:
      chain:
        middlewares:
          - quitar-identidad
          - iam-forward-auth
          - limite-cuerpo

    # Login y recuperación (UC32): 15 intentos por minuto por IP, en un solo cupo compartido. Con 15 (y no 5) un aula o un jurado
    # detrás de una misma IP no se bloquean entre sí; sigue siendo un tope real contra la fuerza bruta desde una IP.
    iam-rate-limit:
      rateLimit:
        average: 15
        period: 1m
        burst: 15

    # El refresh es tráfico legítimo (una vez cada 15 min por usuario y varios usuarios pueden salir por la misma IP):
    # su propio límite y su propio contador, para que no gaste el cupo del login.
    iam-rate-limit-refresh:
      rateLimit:
        average: 20
        period: 1m
        burst: 10

    # Registro y restablecimiento de contraseña: cada uno calcula un Argon2 (64 MiB, 4 a la vez por réplica). Sin tope, un
    # anónimo satura esos cupos y el login responde 503 SERVICIO_OCUPADO. Cupo propio (no gasta el del login) y ráfaga
    # holgada para que un aula entera detrás de una misma IP pueda registrarse.
    iam-rate-limit-registro:
      rateLimit:
        average: 20
        period: 1m
        burst: 20

    # Lecturas públicas del catálogo, el mapa, la disponibilidad y las reseñas: consultas caras (PostGIS, búsqueda de
    # texto). 10 por segundo por IP con ráfaga de 100: no molesta a un usuario ni a un aula, y frena un barrido o una inundación
    # desde una sola IP. Traefik crea una instancia por router: el catálogo, las reservas y las reseñas llevan cada uno su contador.
    publico-rate-limit:
      rateLimit:
        average: 600
        period: 1m
        burst: 100

    # POST anónimo que suma a la demanda que ve la Entidad (se deduplica por IP, servicio y día): una persona lo pulsa pocas
    # veces; más que eso es inflar las cifras.
    intencion-rate-limit:
      rateLimit:
        average: 30
        period: 1m
        burst: 10

    # Ningún cuerpo JSON de la API pasa de 1 MB (las fotos van directo a SeaweedFS y los documentos tienen su propio
    # tope de 6 MB, abajo). Sin esto, cualquiera hace que el servicio lea y valide cuerpos de cualquier tamaño.
    limite-cuerpo:
      buffering:
        maxRequestBodyBytes: 1048576 # 1 MB

    # El IAM rechaza documentos de más de 5 MB; aquí se corta antes de que lleguen enteros al servicio.
    iam-limite-documentos:
      buffering:
        maxRequestBodyBytes: 6291456 # 6 MB

    # Subida directa del navegador a SeaweedFS (URL firmada). Origen = la PWA; sin comodines.
    # HSTS: el navegador solo vuelve por HTTPS. Un día por ahora (dominio provisional); subirlo cuando el dominio sea el definitivo.
    # Traefik solo lo agrega en las respuestas HTTPS.
    hsts:
      headers:
        stsSeconds: 86400

    # El origen de la PWA con HTTPS sale de DOMINIO_PUBLICO (plantilla del proveedor de archivos; en infra/.env).
    # Los orígenes de desarrollo (http://localhost) solo se aceptan cuando DOMINIO_PUBLICO es localhost: en un servidor con
    # dominio real, una página en localhost de otra persona no debe poder usar este S3. Las líneas de plantilla van como
    # comentarios YAML para que el archivo siga siendo YAML válido; Traefik las procesa igual.
    almacenamiento-cors:
      headers:
        accessControlAllowOriginList:
          - 'https://{{ env "DOMINIO_PUBLICO" }}'
          # {{ if eq (env "DOMINIO_PUBLICO") "localhost" }}
          - http://localhost
          - http://localhost:5173
          # {{ end }}
        accessControlAllowMethods: [GET, PUT, HEAD, OPTIONS]
        accessControlAllowHeaders: [Content-Type, Content-Length]
        accessControlMaxAge: 600

  serversTransports:
    # El chat puede tardar hasta 45 s (el servicio corta a los 45 s con un 503): se espera hasta 60 s.
    respuesta-larga:
      forwardingTimeouts:
        responseHeaderTimeout: 60s
