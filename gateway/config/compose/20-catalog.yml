# catalog-service · /api/catalog → catalog-service:8002, sin quitar el prefijo. Contrato: contracts/openapi/catalog.yaml
# Públicas = las operaciones con `security: []` del contrato. Todo lo demás (prestador, Entidad, analítica) con sesión.
http:
  routers:
    catalog-publicas:
      rule: >-
        Method(`GET`) && (Path(`/api/catalog/servicios`)
        || PathRegexp(`^/api/catalog/servicios/[^/]+$`)
        || Path(`/api/catalog/buscar`)
        || Path(`/api/catalog/zonas`)
        || Path(`/api/catalog/alertas`)
        || PathPrefix(`/api/catalog/mapa/`))
      priority: 100
      middlewares: [quitar-identidad, publico-rate-limit]
      service: catalog-service

    # Anónimo y suma a lo que ve la Entidad: cupo propio y más estricto.
    catalog-intencion-visita:
      rule: "Method(`POST`) && PathRegexp(`^/api/catalog/servicios/[^/]+/intencion-visita$`)"
      priority: 100
      middlewares: [quitar-identidad, intencion-rate-limit, limite-cuerpo]
      service: catalog-service

    catalog-protegidas:
      rule: "PathPrefix(`/api/catalog`)"
      priority: 10
      middlewares: [protegida]
      service: catalog-service

  services:
    catalog-service:
      loadBalancer:
        servers:
          - url: http://catalog-service:8002
