# review-service · /api/reviews → review-service:8004, sin quitar el prefijo. Contrato: contracts/openapi/review.yaml
# Públicas: leer reseñas y su resumen. Escribir, responder, reportar y moderar exigen sesión.
http:
  routers:
    review-publicas:
      rule: >-
        Method(`GET`) && (PathRegexp(`^/api/reviews/servicios/[^/]+/(resenas|resumen)$`)
        || PathRegexp(`^/api/reviews/resenas/[^/]+$`))
      priority: 100
      middlewares: [quitar-identidad]
      service: review-service

    review-protegidas:
      rule: "PathPrefix(`/api/reviews`)"
      priority: 10
      middlewares: [protegida]
      service: review-service

  services:
    review-service:
      loadBalancer:
        servers:
          - url: http://review-service:8004
