# booking-service · /api/bookings → booking-service:8003 sin quitar el prefijo. Equivale a ../../compose/30-booking.yml.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: booking-service }
spec:
  entryPoints: [web]
  routes:
    - match: Method(`GET`) && Path(`/api/bookings/disponibilidad`)
      kind: Rule
      priority: 100
      middlewares: [{ name: quitar-identidad }, { name: publico-rate-limit }]
      services: [{ name: booking-service, port: 8003 }]
    - match: PathPrefix(`/api/bookings`)
      kind: Rule
      priority: 10
      middlewares: [{ name: protegida }]
      services: [{ name: booking-service, port: 8003 }]
