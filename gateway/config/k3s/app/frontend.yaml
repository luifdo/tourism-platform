# Frontend (PWA): cualquier ruta que no sea de un servicio. Prioridad mínima. Equivale a ../../compose/90-frontend.yml.
# Falta el Service "frontend" (puerto 80, hacia el 8080 del contenedor) y su NetworkPolicy: faltan los manifiestos de k8s del frontend.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: frontend }
spec:
  entryPoints: [web]
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      middlewares: [{ name: quitar-identidad }]
      services: [{ name: frontend, port: 80 }]
