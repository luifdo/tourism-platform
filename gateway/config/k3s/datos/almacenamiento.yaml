# SeaweedFS (S3) publicado por el gateway, por nombre de host: la firma de la URL incluye el host, así que
# no sirve un prefijo. Vive en turismo-datos porque Traefik solo enruta a Services de su propio namespace.
# Sirve cualquier host que empiece por `s3.` (s3.localhost en local, s3.<dominio> en el servidor); el dominio va en
# S3_ENDPOINT_PUBLICO e IMAGENES_URL_PUBLICA de los servicios. El origen de la PWA de la lista de CORS NO es una plantilla
# aquí (los CRD no las admiten): hay que poner el dominio definitivo en lugar del provisional.
# Sin ForwardAuth: la autenticación es la firma. OJO: expone TODO el S3; el acceso anónimo de SeaweedFS debe seguir
# limitado a Read:catalogo-imagenes (Secret seaweedfs-identidades de infra/k8s) o los documentos de verificación quedan legibles.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: almacenamiento-cors }
spec:
  headers:
    accessControlAllowOriginList: [http://localhost, http://localhost:5173, https://3-141-142-12.sslip.io]
    accessControlAllowMethods: [GET, PUT, HEAD, OPTIONS]
    accessControlAllowHeaders: [Content-Type, Content-Length]
    accessControlMaxAge: 600
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: almacenamiento }
spec:
  entryPoints: [web]
  routes:
    - match: HostRegexp(`^s3\..+$`)
      kind: Rule
      priority: 100
      middlewares: [{ name: almacenamiento-cors }]
      services: [{ name: seaweedfs, port: 8333 }]
