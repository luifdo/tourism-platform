# SeaweedFS (S3) publicado por el gateway, por nombre de host: la firma de la URL incluye el host, así que
# no sirve un prefijo. Vive en turismo-datos porque Traefik solo enruta a Services de su propio namespace.
# El host se cambia al definir el dominio (hoy local: s3.localhost; en la VM, s3.<ip>.sslip.io). Ese mismo valor va
# en S3_ENDPOINT_PUBLICO e IMAGENES_URL_PUBLICA de los servicios, y el origen de la PWA en la lista de CORS.
# Sin ForwardAuth: la autenticación es la firma. OJO: expone TODO el S3; el acceso anónimo de SeaweedFS debe limitarse
# a Read:catalogo-imagenes (infra/seaweedfs/s3.json) o los documentos de verificación quedan legibles.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: almacenamiento-cors }
spec:
  headers:
    accessControlAllowOriginList: [http://localhost, http://localhost:5173]
    accessControlAllowMethods: [GET, PUT, HEAD, OPTIONS]
    accessControlAllowHeaders: [Content-Type, Content-Length]
    accessControlMaxAge: 600
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: almacenamiento }
spec:
  entryPoints: [web]
  routes:
    - match: Host(`s3.localhost`)
      kind: Rule
      priority: 100
      middlewares: [{ name: almacenamiento-cors }]
      services: [{ name: seaweedfs, port: 8333 }]
