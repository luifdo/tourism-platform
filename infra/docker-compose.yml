# Entorno local de la plataforma. Uso, desde la carpeta infra/:
#   cp .env.example .env
#   docker compose up -d
#
# Por ahora levanta solo la infraestructura compartida; cada servicio se agrega
# en la sección "Microservicios" cuando tenga su Dockerfile.

name: tourism-platform

# Variables comunes de catalog-service (API, worker y migraciones). Los hosts son los nombres
# de los contenedores de este archivo; las credenciales salen de infra/.env.
x-catalog-entorno: &catalog-entorno
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog_db
  VALKEY_URL: redis://valkey:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
  IAM_URL_INTERNA: http://iam-service:8001
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  INTENCION_VISITA_SECRETO: ${CATALOG_INTENCION_VISITA_SECRETO}
  # El navegador sube las imágenes directo a SeaweedFS: el endpoint es el que ve el host.
  S3_ENDPOINT_PUBLICO: http://localhost:8333
  S3_ACCESS_KEY: catalog_access_dev
  S3_SECRET_KEY: catalog_secret_dev
  IMAGENES_URL_PUBLICA: http://localhost:8333/catalogo-imagenes

services:
  # ---------- Persistencia ----------
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5

  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]

  # Imágenes del catálogo (API S3). Credenciales de desarrollo en el archivo de catalog-service.
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=5
    ports: ["8333:8333"]
    volumes:
      - seaweedfs-data:/data
      - ../services/catalog-service/dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 10s
      retries: 10

  seaweedfs-init:
    image: chrislusf/seaweedfs:3.80
    depends_on:
      seaweedfs: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c", "echo 's3.bucket.create -name catalogo-imagenes' | weed shell -master=seaweedfs:9333"]
    restart: "no"

  # review-service usa PostgreSQL con JSONB (base review_db), ver ADR-003.

  # ---------- Mensajería ----------
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # consola web
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 5

  # Correos de desarrollo: Mailpit los recibe por SMTP y los muestra en http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # bandeja web

  # ---------- Observabilidad ----------
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # ---------- Microservicios ----------
  # catalog-service (Módulo 2): las migraciones corren una vez y luego arrancan API y worker.
  catalog-migraciones:
    build: ../services/catalog-service
    image: catalog-service:local
    command: ["alembic", "upgrade", "head"]
    environment: *catalog-entorno
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  catalog-service:
    image: catalog-service:local
    environment: *catalog-entorno
    ports: ["8002:8002"]
    depends_on:
      catalog-migraciones: { condition: service_completed_successfully }
      valkey: { condition: service_started }
      rabbitmq: { condition: service_healthy }

  catalog-worker:
    image: catalog-service:local
    command: ["python", "-m", "app.worker"]
    environment: *catalog-entorno
    ports: ["9102:9102"]   # /metrics
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/metrics')"]
      interval: 30s
      retries: 3
    depends_on:
      catalog-migraciones: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  # Plantilla para agregar un servicio:
  # booking-service:
  #   build: ../services/booking-service
  #   env_file: ../services/booking-service/.env
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     rabbitmq: { condition: service_healthy }

  # ---------- API Gateway ----------
  # Traefik (ADR-007); en el clúster k3s viene incluido como Ingress.

volumes:
  postgres-data:
  seaweedfs-data:
