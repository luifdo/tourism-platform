# ESC-06 y Plan §7.6: un clúster nuevo desde el respaldo. No va en la kustomization: se aplica solo
# para restaurar (ver README.md). No tiene `backup` para no escribir sobre el archivo del original.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-restaurado
  namespace: turismo-datos
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgis:16-3.4
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
      timezone: UTC
  storage:
    size: 10Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  bootstrap:
    recovery:
      source: postgres-respaldo
      # Para volver a un momento anterior a la corrupción:
      # recoveryTarget: { targetTime: "2026-11-01 10:00:00+00" }
  externalClusters:
    - name: postgres-respaldo
      barmanObjectStore:
        serverName: postgres # el clúster que escribió el respaldo
        destinationPath: s3://respaldos-postgres/
        endpointURL: http://seaweedfs.turismo-datos.svc:8333
        s3Credentials:
          accessKeyId: { name: postgres-respaldos, key: ACCESS_KEY_ID }
          secretAccessKey: { name: postgres-respaldos, key: SECRET_ACCESS_KEY }
        wal: { compression: gzip }
