# Almacenamiento S3: imágenes del catálogo, documentos de verificación y respaldos de PostgreSQL.
# Las identidades van en un Secret porque llevan las llaves; `anonymous` solo lee las imágenes (C-46).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: turismo-datos
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args:
            - server
            - -ip.bind=0.0.0.0
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            # Cada colección reserva varios volúmenes: con pocos, una deja a las otras sin dónde
            # escribir (F-10 en services/iam-service/docs/verificacion-fase4.md).
            - -volume.max=30
          ports:
            - { name: s3, containerPort: 8333 }
            - { name: master, containerPort: 9333 }
            - { name: master-grpc, containerPort: 19333 }
            - { name: filer, containerPort: 8888 }
            - { name: filer-grpc, containerPort: 18888 }
          readinessProbe:
            httpGet: { path: /cluster/status, port: 9333 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /cluster/status, port: 9333 }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: identidades, mountPath: /etc/seaweedfs, readOnly: true }
            - { name: datos, mountPath: /data }
      volumes:
        - name: identidades
          secret: { secretName: seaweedfs-identidades }
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 20Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: turismo-datos
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - { name: s3, port: 8333 }
    - { name: master, port: 9333 }
    # weed shell usa gRPC con el maestro y el filer.
    - { name: master-grpc, port: 19333 }
    - { name: filer, port: 8888 }
    - { name: filer-grpc, port: 18888 }
---
# Repetirlo no cambia nada: un bucket que ya existe se deja igual.
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-buckets
  namespace: turismo-datos
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: crear
          image: chrislusf/seaweedfs:3.80
          command: ["/bin/sh", "-c"]
          args:
            - >-
              printf 's3.bucket.create -name catalogo-imagenes\ns3.bucket.create -name documentos-verificacion\ns3.bucket.create -name respaldos-postgres\n'
              | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
