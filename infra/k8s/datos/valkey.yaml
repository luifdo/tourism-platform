# Caché, tokens revocados, idempotencia y sesiones del chat. Con AOF y volumen: un reinicio no debe
# devolverle la validez a un token revocado. Bases: catalog 0, booking 1, iam 2, recommendation 3.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: turismo-datos
  labels:
    app.kubernetes.io/name: valkey
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: valkey
          image: valkey/valkey:8
          command: ["valkey-server"]
          args: ["--requirepass", "$(VALKEY_PASSWORD)", "--appendonly", "yes", "--dir", "/data"]
          envFrom:
            - secretRef: { name: valkey-credenciales } # VALKEY_PASSWORD
          ports:
            - { name: valkey, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ["sh", "-c", 'valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: datos, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: turismo-datos
  labels:
    app.kubernetes.io/name: valkey
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - { name: valkey, port: 6379 }
