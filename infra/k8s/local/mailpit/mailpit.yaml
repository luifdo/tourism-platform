apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: { app.kubernetes.io/name: mailpit }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailpit }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.21 # la misma que el compose
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: web, containerPort: 8025 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025 }
    - { name: web, port: 8025 }
---
# turismo-datos niega la entrada por defecto: solo turismo-app envía correo; la API web se usa por port-forward.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailpit
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: turismo-app }
      ports:
        - { port: 1025 }
