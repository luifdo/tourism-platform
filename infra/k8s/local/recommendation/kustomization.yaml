# recommendation-service en el k3s local (infra/k8s/k3s_local.py). Ver iam/kustomization.yaml.
# Sin LLM_API_KEY en el Secret el chat responde 503; el resto funciona.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: turismo-app

resources:
  - ../../../../services/recommendation-service/k8s/base

images:
  - name: ghcr.io/luifdo/recommendation-service
    newName: recommendation-service
    newTag: local

components:
  - ../comun
