global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: catalog-service
    static_configs:
      - targets: ["catalog-service:8002"]

  - job_name: catalog-worker
    static_configs:
      - targets: ["catalog-worker:9102"]

  # Agregar un job por microservicio cuando exponga métricas, por ejemplo:
  # - job_name: booking-service
  #   static_configs:
  #     - targets: ["booking-service:8003"]
