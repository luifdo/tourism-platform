# Migraciones de booking_db (Alembic). Uso, desde services/booking-service:
#   alembic upgrade head        # aplica todas las migraciones pendientes
#   alembic downgrade -1        # deshace la última
#   alembic current             # en qué versión está la base
# La URL no va aquí: se lee de DATABASE_URL (config.py), así no se sube ninguna contraseña.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# Nombre de archivo: 0001_esquema_inicial.py (número de versión legible + descripción).
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
