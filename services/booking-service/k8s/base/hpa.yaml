# Réplicas y objetivo de CPU según la tabla del Plan §7.3.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: 2
  maxReplicas: 6 # Plan §7.3: booking 2-6 al 70 %; el bloqueo por fila permite escalar
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # en un pico sube de una vez
    scaleDown:
      stabilizationWindowSeconds: 300 # baja despacio para no oscilar
