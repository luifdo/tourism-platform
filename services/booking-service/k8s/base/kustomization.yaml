# booking-service (Módulo 3), a partir de templates/service-template/k8s (Plan §7.2-7.4).
# Incluye los CronJobs expirar-solicitudes y finalizar-reservas de la Guía §6.4 (cronjobs.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: turismo-app

labels:
  - pairs:
      app.kubernetes.io/part-of: turismo-santa-marta
    includeSelectors: false

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - cronjobs.yaml

images:
  - name: booking-service
    newName: ghcr.io/luifdo/booking-service
    newTag: develop # Al desplegar se fija el sha del commit con kustomize edit set image en un PR deploy(booking-service): <sha>.
