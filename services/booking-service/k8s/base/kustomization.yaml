# booking-service (Módulo 3), a partir de templates/service-template/k8s (Plan §7.2-7.4).
# Pendiente: los CronJobs expirar-solicitudes y finalizar-reservas de la Guía §6.4.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: turismo-app

labels:
  - pairs:
      app.kubernetes.io/part-of: turismo-santa-marta
    includeSelectors: false

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

images:
  - name: booking-service
    newName: ghcr.io/turismo-santa-marta/booking-service
    newTag: latest # CI la cambia por el commit: kustomize edit set image booking-service=...:<sha>
