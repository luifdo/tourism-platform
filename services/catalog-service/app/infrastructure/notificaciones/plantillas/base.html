<!doctype html>
<html lang="{{ idioma }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f4f1ea;font-family:Arial,Helvetica,sans-serif;color:#1f2a2e;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ea;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;">
        <tr><td style="background:#0f5c6e;color:#ffffff;padding:20px 28px;border-radius:8px 8px 0 0;font-size:18px;font-weight:bold;">
          {% if idioma == "en" %}Santa Marta Tourism{% else %}Turismo Santa Marta{% endif %}
        </td></tr>
        <tr><td style="padding:28px;font-size:15px;line-height:1.55;">
          {% block contenido %}{% endblock %}
        </td></tr>
        <tr><td style="padding:16px 28px;font-size:12px;color:#6b7478;border-top:1px solid #e4e0d6;">
          {% if idioma == "en" %}This is an automatic message, please do not reply.{% else %}Este es un mensaje automático, por favor no lo respondas.{% endif %}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
