{% extends "base.html" %}
{% block contenido %}
  <p>Hello {{ nombre }},</p>
  <p>We're sorry, your request <strong>was not accepted</strong>.</p>
  <table role="presentation" cellpadding="6" cellspacing="0" style="margin:16px 0;border-collapse:collapse;">
    <tr><td style="color:#6b7478;">Service</td><td><strong>{{ servicio }}</strong></td></tr>
    <tr><td style="color:#6b7478;">Date</td><td>{{ fecha }}</td></tr>
    <tr><td style="color:#6b7478;">People</td><td>{{ personas }}</td></tr>
  </table>
  {% if motivo %}<p><strong>Reason:</strong> {{ motivo }}</p>{% endif %}
  <p>You can look for other options on the platform.</p>
{% endblock %}
