{% extends "base.html" %}
{% block contenido %}
  <p>Hola, {{ nombre }}:</p>
  <p>Lo sentimos, tu solicitud <strong>no fue aceptada</strong>.</p>
  <table role="presentation" cellpadding="6" cellspacing="0" style="margin:16px 0;border-collapse:collapse;">
    <tr><td style="color:#6b7478;">Servicio</td><td><strong>{{ servicio }}</strong></td></tr>
    <tr><td style="color:#6b7478;">Fecha</td><td>{{ fecha }}</td></tr>
    <tr><td style="color:#6b7478;">Personas</td><td>{{ personas }}</td></tr>
  </table>
  {% if motivo %}<p><strong>Motivo:</strong> {{ motivo }}</p>{% endif %}
  <p>Puedes buscar otras opciones en la plataforma.</p>
{% endblock %}
