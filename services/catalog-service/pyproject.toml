[project]
name = "catalog-service"
version = "0.1.0"
description = "Módulo 2: Catálogo, GIS & Inteligencia de Destino de la Plataforma Digital de Turismo — Santa Marta"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "geoalchemy2>=0.16",
    "prometheus-fastapi-instrumentator>=7.0",
    "tzdata>=2024.1",
    "valkey>=6.0",
    "httpx>=0.28",
    "boto3>=1.35",
    "aio-pika>=9.4",
    "prometheus-client>=0.21",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres,redis,rabbitmq]>=4.8",
    "openapi-core>=0.23.1",
    "jsonschema>=4.26.0",
    "schemathesis>=4.32.4",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# El SQL de las migraciones se lee mejor sin cortar las expresiones.
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Solo app/ tiene __init__.py; importlib evita choques entre pruebas con el mismo nombre.
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requiere Docker (PostGIS real con testcontainers)",
    "sin_contrato: la prueba se sale del contrato a propósito (no se validan sus respuestas)",
]

# Cobertura (Plan §8.1: mínimo 70 %): uv run pytest --cov
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = false
skip_covered = true
