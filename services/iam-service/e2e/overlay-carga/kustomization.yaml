# ENTORNO DE PRUEBA, NO DE PRODUCCIÓN: el overlay e2e con el límite del login subido para la
# prueba de carga (scripts/carga_k3d.py). En k3d todos los clientes llegan con la misma IP (F-08),
# así que el límite real de 15 por minuto cortaría la carga en el login 16. El middleware sigue
# en la cadena de Traefik, con un umbral que la prueba no alcanza.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../overlay

patches:
  - target:
      kind: Middleware
      name: iam-rate-limit
    patch: |-
      - op: replace
        path: /spec/rateLimit
        value:
          average: 100
          period: 1s
          burst: 100
