# Plan §7.3: la API atiende el ForwardAuth de cada petición protegida de la plataforma.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iam-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iam-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # en un pico sube de una vez
    scaleDown:
      stabilizationWindowSeconds: 300 # baja despacio para no oscilar
