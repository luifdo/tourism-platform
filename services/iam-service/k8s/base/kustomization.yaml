# Manifiestos de iam-service (Plan §7.2-7.4). La base no trae los Secrets: `iam-secretos` lo genera
# cada overlay desde un archivo que no se sube, e `iam-jwt-keys` se crea aparte con kubectl
# (ver "Despliegue" en el README del servicio). El IngressRoute y los middlewares están en gateway/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: turismo-app

labels:
  - pairs:
      app.kubernetes.io/part-of: turismo-santa-marta
    includeSelectors: false

resources:
  - configmap.yaml
  - deployment-api.yaml
  - deployment-worker.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

images:
  - name: iam-service
    newName: ghcr.io/luifdo/iam-service
    newTag: develop # Al desplegar se fija el sha del commit con kustomize edit set image en un PR deploy(iam-service): <sha>.
