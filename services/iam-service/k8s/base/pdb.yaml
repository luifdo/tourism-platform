# Al drenar un nodo (mantenimiento, Escenario B) siempre queda al menos una réplica atendiendo.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: iam-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iam-service
      app.kubernetes.io/component: api
