# Entorno local del Módulo 5. Desde esta carpeta:
#   cp .env.example .env
#   docker compose up --build

name: recommendation

services:
  recommendation-service:
    build: .
    env_file: .env
    ports: ["8005:8005"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      mock-plataforma: { condition: service_healthy }

  # Simula catalog, booking y review (las URLs de .env apuntan aquí).
  mock-plataforma:
    build: ./mocks
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: recommendation_db
      POSTGRES_USER: turismo
      POSTGRES_PASSWORD: turismo
    # Puertos publicados para las pruebas de integración desde el equipo; no chocan con
    # los de iam-service (5433 y 6379).
    ports: ["5434:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turismo -d recommendation_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    ports: ["6380:6379"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  valkey_data:
