# Kubernetes de Docker Desktop. La infraestructura es la de infra/docker-compose.yml, a la que
# los pods llegan por host.docker.internal.
#   cp secretos.env.example secretos.env
#   docker build -t recommendation-service:local ../../..
#   kubectl apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# El Secret generado aquí debe quedar en el mismo namespace que la base; si no, Kustomize no
# pone su nombre con hash en el Deployment.
namespace: turismo-app

resources:
  - namespace.yaml
  - ../../base

images:
  - name: ghcr.io/luifdo/recommendation-service # nombre que deja la base
    newName: recommendation-service
    newTag: local # la imagen construida en tu Docker; con una etiqueta fija no se descarga

patches:
  - path: configmap-local.yaml

# El initContainer y el contenedor piden el Secret con el nombre que crea infra/k8s/generar_secretos.py.
# Con este generador el nombre real lleva un hash, que Kustomize cambia solo en las referencias.
secretGenerator:
  - name: recommendation-secretos
    envs:
      - secretos.env
