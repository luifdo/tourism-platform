# Corre la prueba ESC-01 de k6 dentro del clúster (guía en k6/README.md). Los scripts llegan por el
# ConfigMap `k6-scripts`; PERFIL y SERVICIO_ID la ajustan.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-review
  namespace: turismo-app
  labels:
    app.kubernetes.io/name: k6-review
    app.kubernetes.io/part-of: turismo-santa-marta
spec:
  backoffLimit: 0 # una prueba de carga no se reintenta sola
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6-review
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: k6-review
          image: grafana/k6:1.0.0
          args: ["run", "/scripts/esc01.js"]
          env:
            - name: PERFIL
              value: humo # o completo (en el clúster k3s, no en un PC)
            - name: SERVICIO_ID # un servicio con reseñas: el resumen responde con datos
              value: "00000000-0000-0000-0000-000000000000"
            # En k3s se mide entrando por Traefik, como un turista; en local, directo al Service:
            # - name: CATALOG_URL
            #   value: https://turismo-santamarta.gov.co/api/catalog
            # - name: REVIEW_URL
            #   value: https://turismo-santamarta.gov.co/api/reviews
          resources:
            requests: { cpu: 200m, memory: 128Mi }
            limits: { cpu: "2", memory: 1Gi }
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-review
