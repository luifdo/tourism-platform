# API REST. Antes de atender, el initContainer aplica las migraciones; si varios pods arrancan
# a la vez, el candado de migrations/env.py hace que esperen al primero. Las migraciones deben
# ser compatibles hacia atrás: durante el rolling update los pods viejos siguen atendiendo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  labels:
    app.kubernetes.io/name: review-service
    app.kubernetes.io/component: api
spec:
  replicas: 1 # el HPA lo ajusta entre 1 y 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: review-service
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: review-service
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migraciones
          image: review-service
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: review-config
            - secretRef:
                name: review-secretos
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: review-service
          ports:
            - name: http
              containerPort: 8004
          envFrom:
            - configMapRef:
                name: review-config
            - secretRef:
                name: review-secretos
          resources:
            # En reposo (solo sondas y métricas) la API usa 25-45m: con menos request, el HPA no
            # bajaría nunca de 3 réplicas. El HPA calcula el 75 % sobre este valor.
            requests: { cpu: 100m, memory: 160Mi }
            limits: { cpu: 1000m, memory: 320Mi } # 1 CPU al arrancar: importar la app es pesado
          # Mientras la app arranca no corren las otras sondas: hasta 90 s para empezar a
          # escuchar en un nodo lento, sin que la liveness lo mate a medio arranque.
          startupProbe:
            httpGet: { path: /metrics, port: http }
            periodSeconds: 2
            failureThreshold: 45
            timeoutSeconds: 2
          # Readiness con /health (incluye la base): una réplica con problemas sale del
          # enrutamiento en menos de 5 s (ESC-01, Plan §7.3).
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 2
            timeoutSeconds: 2
          # Liveness con /metrics, que no toca la base: si PostgreSQL cae, las réplicas dejan
          # de recibir tráfico pero no se reinician todas sin motivo.
          livenessProbe:
            httpGet: { path: /metrics, port: http }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              # Da tiempo a que Traefik saque el pod de sus endpoints antes de apagarlo.
              exec:
                command: ["python", "-c", "import time; time.sleep(5)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
