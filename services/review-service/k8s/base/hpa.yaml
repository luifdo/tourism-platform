# Plan §7.3: review recibe poca carga (lecturas de la ficha y de la tool `resenas_servicio`):
# 1 réplica que sube hasta 3 al 75 % de CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: review-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: review-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      # Toma la recomendación más baja del último minuto: el pico de CPU al arrancar un pod
      # (importar la app) no hace escalar; una carga sostenida sí.
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300 # baja despacio para no oscilar
