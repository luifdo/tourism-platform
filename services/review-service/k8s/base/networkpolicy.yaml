# Plan §7.4: solo entra el tráfico previsto. La salida no se restringe (la API y el worker
# hablan con PostgreSQL y RabbitMQ). Review no llama a ningún otro servicio.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: review-service-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: review-service
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from: # Traefik (Ingress de k3s)
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports: [{ port: 8004 }]
    - from: # recommendation-service (tool `resenas_servicio` del chatbot)
        - podSelector:
            matchLabels: { app.kubernetes.io/name: recommendation-service }
      ports: [{ port: 8004 }]
    - from: # Prometheus lee /metrics
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observabilidad }
          podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports: [{ port: 8004 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: review-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: review-service
      app.kubernetes.io/component: worker
  policyTypes: ["Ingress"]
  ingress:
    - from: # nadie llama al worker; solo Prometheus lee sus métricas
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observabilidad }
          podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports: [{ port: 9104 }]
