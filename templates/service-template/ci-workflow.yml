# Plantilla de CI para un servicio (C-61), copiada de .github/workflows/iam-service.yml.
#
# Cómo usarla:
#   1. cp templates/service-template/ci-workflow.yml .github/workflows/<servicio>.yml
#   2. Reemplaza `service-template` por el nombre del servicio (sed -i 's/service-template/<servicio>/g').
#   3. Ajusta lo marcado con AJUSTAR: services y variables que piden sus pruebas, el paso de
#      migraciones y las carpetas de cobertura. Si las pruebas levantan todo con testcontainers
#      (como catalog y review), quita `services:` y el paso de migraciones.
#
# Requiere en el servicio: pyproject.toml + uv.lock, ruff y pytest-cov en el grupo dev, y un
# Dockerfile que instale con uv 0.13.1. Publica en ghcr.io/<dueño del repo>/<servicio> con las
# etiquetas <sha> y develop, solo en push a develop. Fuera de .github/workflows GitHub no la ejecuta.

name: service-template

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "services/service-template/**"
      # Las pruebas de contrato leen contracts/openapi/ y contracts/events/.
      - "contracts/**"
      - ".github/workflows/service-template.yml"
  push:
    branches: [develop]
    paths:
      - "services/service-template/**"
      - "contracts/**"
      - ".github/workflows/service-template.yml"
  workflow_dispatch:

concurrency:
  group: service-template-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  IMAGEN_LOCAL: service-template:ci

jobs:
  calidad:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/service-template
    env:
      UV_FROZEN: "1"
      # AJUSTAR: las variables que lee la configuración del servicio en las pruebas.
      DATABASE_URL: postgresql+asyncpg://servicio:servicio@localhost:5433/servicio_db
    # AJUSTAR: lo que las pruebas esperan ya levantado (iam agrega Valkey; SeaweedFS va con
    # docker run porque un service no admite su comando). Si usan testcontainers, quítalo.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: servicio_db
          POSTGRES_USER: servicio
          POSTGRES_PASSWORD: servicio
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U servicio -d servicio_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv (misma versión que el Dockerfile)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/service-template/uv.lock

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # AJUSTAR: quítalo si las pruebas aplican las migraciones (conftest con testcontainers).
      - name: Migraciones
        run: uv run alembic upgrade head

      # AJUSTAR: las carpetas de cobertura (src/ en la plantilla; app/ en iam, catalog y review).
      # Mínimo del Plan §8.1: 70 %.
      - name: Pruebas con cobertura
        run: >-
          uv run pytest -q -rs
          --cov=src/domain
          --cov=src/application
          --cov-report=term
          --cov-fail-under=70
          --junitxml=reporte-pruebas.xml

      - name: Exigir cero pruebas omitidas
        if: ${{ !cancelled() }}
        run: |
          uv run python - <<'PY'
          import os
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reporte = Path("reporte-pruebas.xml")
          if not reporte.is_file():
              sys.exit("pytest no generó el reporte: no se puede comprobar qué se omitió.")

          casos = list(ET.parse(reporte).getroot().iter("testcase"))
          omitidas = [c for c in casos if c.find("skipped") is not None]
          fallidas = [c for c in casos if c.find("failure") is not None or c.find("error") is not None]
          cobertura = subprocess.run(
              ["coverage", "report", "--format=total"], capture_output=True, text=True
          ).stdout.strip()

          lineas = [
              "### service-template: pruebas",
              "",
              f"- Ejecutadas: {len(casos)}",
              f"- Fallidas: {len(fallidas)}",
              f"- Omitidas: {len(omitidas)}",
              f"- Cobertura de src/domain y src/application: {cobertura or 'sin dato'} %",
              "",
          ]
          for caso in omitidas:
              motivo = caso.find("skipped").get("message", "sin motivo")
              lineas.append(f"- Omitida: `{caso.get('classname')}.{caso.get('name')}`: {motivo}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as resumen:
              resumen.write("\n".join(lineas) + "\n")

          if not casos:
              sys.exit("El reporte no tiene pruebas.")
          if omitidas:
              # Una integración caída se omite sola: sin esto, el job pasaría en verde.
              # Si un día hace falta omitir una a propósito, cambia esta regla de forma explícita.
              sys.exit(f"{len(omitidas)} pruebas omitidas: la regla es cero omisiones.")
          PY

  imagen:
    needs: calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construir la imagen
        uses: docker/build-push-action@v7
        with:
          context: services/service-template
          push: false
          load: true
          tags: ${{ env.IMAGEN_LOCAL }}
          cache-from: type=gha,scope=service-template
          cache-to: type=gha,mode=max,scope=service-template

      - name: Escanear con Trivy
        # Sin etiqueta mayor en este repositorio: se fija por el commit de la etiqueta.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGEN_LOCAL }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Guarda la base de vulnerabilidades con actions/cache, para no descargarla cada vez.
          cache: "true"

      - name: Resumen
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "### service-template: imagen"
            echo ""
            echo "Construida y escaneada (CRITICAL con parche disponible)."
            echo ""
            echo "En push a \`develop\`, el job \`publicar\` la sube como" \
              "\`ghcr.io/${OWNER,,}/service-template\` con dos etiquetas: el SHA del commit y \`develop\`."
            echo "Para desplegar se fija el SHA en un PR \`deploy(service-template): <sha>\`."
          } >> "$GITHUB_STEP_SUMMARY"

  publicar:
    needs: imagen
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Entrar a GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular el nombre de la imagen
        id: nombre
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "imagen=ghcr.io/${OWNER,,}/service-template" >> "$GITHUB_OUTPUT"

      # Reutiliza de la caché las capas que escaneó el job imagen.
      - name: Publicar con la etiqueta del commit y develop
        uses: docker/build-push-action@v7
        with:
          context: services/service-template
          push: true
          tags: |
            ${{ steps.nombre.outputs.imagen }}:${{ github.sha }}
            ${{ steps.nombre.outputs.imagen }}:develop
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=service-template

      - name: Resumen
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: |
          {
            echo "### service-template: imagen publicada"
            echo ""
            echo "- \`${IMAGEN}:${GITHUB_SHA}\`"
            echo "- \`${IMAGEN}:develop\`"
          } >> "$GITHUB_STEP_SUMMARY"
