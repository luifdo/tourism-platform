# Réplicas y objetivo de CPU según la tabla del Plan §7.3.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: service-template
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service-template
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # en un pico sube de una vez
    scaleDown:
      stabilizationWindowSeconds: 300 # baja despacio para no oscilar
